name: Update Dashboard

on:
  schedule:
    - cron: "0 3 * * *"   # 3am nightly
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/scrape_tournamentsoftware.py

      - name: Commit updated dashboard.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Home/data/dashboard.json
          git commit -m "Update dashboard JSON"
          git push
