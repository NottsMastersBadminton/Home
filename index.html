<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Notts Masters Badminton</title>

<meta name="description" content="Official site for Notts Masters Badminton. Fixtures, results, officials and documents.">

<style>

html,body{
    margin:0;
    padding:0;
}

body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f5f5;
    color:#222;
    overflow-x:hidden;
}

.page-wrapper{
    max-width:1200px;
    margin:auto;
}

header{
    background:#0a1a33;
    color:white;
    text-align:center;
    padding:20px;
}

.dashboard-wrapper{
    padding:20px;
}

.hero-card{
    background:linear-gradient(135deg,#06261C,#083024);
    color:white;
    border-radius:20px;
    padding:30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    margin-bottom:25px;
}

.hero-left{
    flex:1;
}

.hero-label{
    font-size:.85rem;
    letter-spacing:2px;
    opacity:.8;
}

.hero-countdown{
    font-size:clamp(2rem,5vw,4rem);
    font-weight:800;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    border-radius:18px;
    padding:25px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.stat-card span{
    display:block;
    color:#666;
}

.stat-card strong{
    display:block;
    margin-top:12px;
    font-size:2rem;
    color:#06261C;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.panel{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.panel h2{
    margin-top:0;
    color:#06261C;
}

.fixture-row,
.result-row{
    display:grid;
    grid-template-columns:120px 1fr;
    gap:15px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.fixture-row:last-child,
.result-row:last-child{
    border-bottom:none;
}

.fixture-date{
    color:#666;
    font-size:.9rem;
}

.fixture-title{
    font-weight:600;
}

.fb-container{
    width:100%;
    text-align:center;
    margin-top:30px;
}

.fb-container iframe{
    width:100%;
    max-width:350px;
    height:700px;
    border:none;
    border-radius:10px;
}

.bottom-banner{
    width:100%;
    margin-top:40px;
}

.bottom-banner img{
    width:100%;
    display:block;
}

footer{
    margin-top:40px;
    background:#0a1a33;
    color:white;
    text-align:center;
    padding:20px;
}

@media(max-width:900px){

    .hero-card{
        flex-direction:column;
        text-align:center;
    }

    .dashboard-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .fixture-row,
    .result-row{
        grid-template-columns:1fr;
    }

    .hero-card{
        padding:20px;
    }

}

</style>

</head>

<body>

<div class="page-wrapper">

<header>
    <h1>Notts Masters Badminton</h1>
</header>

<div id="nav"></div>

<script>
fetch("/Home/nav.html")
.then(response => response.text())
.then(data => {
    document.getElementById("nav").innerHTML = data;
});
</script>

<div class="dashboard-wrapper">

<div class="hero-card">

    <div class="hero-left">

        <div class="hero-label">
            NEXT MATCH
        </div>

        <h2 id="nextMatchTitle">
            Loading Fixtures...
        </h2>

        <div id="nextMatchDate">
            Loading...
        </div>

    </div>

    <div id="countdown" class="hero-countdown">
        ...
    </div>

</div>

<div class="stats-grid">

    <div class="stat-card">
        <span>Fixtures Remaining</span>
        <strong id="fixturesRemaining">-</strong>
    </div>

    <div class="stat-card">
        <span>This Month</span>
        <strong id="monthFixtures">-</strong>
    </div>

    <div class="stat-card">
        <span>Age Groups</span>
        <strong id="activeTeams">-</strong>
    </div>

    <div class="stat-card">
        <span>Upcoming Matches</span>
        <strong id="upcomingMatches">-</strong>
    </div>

</div>

<div class="dashboard-grid">

    <div class="panel">

        <h2>🏸 Upcoming Fixtures</h2>

        <div id="fixturesList">
            Loading...
        </div>

    </div>

    <div class="panel">

        <h2>✅ Latest Results</h2>

        <div id="resultsList">
