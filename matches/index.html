<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Matches — Public Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }
    header { background: #0a1a33; color: white; padding: 20px; text-align: center; }
    nav { background: #13294b; display: flex; justify-content: center; flex-wrap: wrap; padding: 10px 0; }
    nav a { color: white; text-decoration: none; margin: 8px 15px; font-weight: 600; }
    nav a:hover { text-decoration: underline; }

    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px 40px; text-align: center; }

    iframe {
      width: 100%; height: 800px; border: 0;
      border-radius: 10px; background: white;
    }

    .message-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
      font-size: 1.2rem;
      margin-top: 40px;
    }

    .back-button {
      display: inline-block; margin: 25px auto 0; padding: 12px 20px;
      background: #13294b; color: white; text-decoration: none;
      font-weight: 600; border-radius: 8px;
    }
    .back-button:hover { background: #0a1a33; }

    footer {
      margin-top: 20px; padding: 20px;
      text-align: center; background: #0a1a33; color: white;
    }
  </style>
</head>
<body>

<header>
  <h1>Notts Masters Badminton</h1>
  <p>Matches — Public Access</p>
</header>

<div id="nav"></div>
<script>
  fetch("../nav.html")
    .then(r => r.text())
    .then(html => document.getElementById("nav").innerHTML = html);
</script>

<div class="container">

  <div id="content"></div>

  <script>
    // Set the date/time when the matches will be released
    // ⚠️ Change this to your real release moment
    const RELEASE_DATE = new Date("2026-09-01T18:00:00");

    function updateCountdown() {
      const now = new Date();
      const diff = RELEASE_DATE - now;
      const content = document.getElementById("content");

      if (diff <= 0) {
        // Countdown finished → show spreadsheet
        content.innerHTML = `
          <iframe src="https://docs.google.com/spreadsheets/d/16ALLKw2po0AvNRycDs8sDFjtdxKZDQSNvxJRvuTwsEU/edit?gid=0#gid=0"></iframe>
        `;
        return;
      }

      // Calculate remaining time
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      content.innerHTML = `
        <div class="message-box">
          <h2>Matches Coming Soon</h2>
          <p>Once all matches have been confirmed, the full fixture list will appear here.</p>

          <h3 style="margin-top:25px;">Countdown to Release</h3>
          <div style="font-size:2rem; font-weight:700; margin-top:10px;">
            ${days}d ${hours}h ${minutes}m ${seconds}s
          </div>
        </div>
      `;
    }

    // Update every second
    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

  <a href="../index.html" class="back-button">⬅ Back to Home</a>

</div>

<footer>
  © Notts Masters Badminton — Matches
</footer>

</body>
</html>
